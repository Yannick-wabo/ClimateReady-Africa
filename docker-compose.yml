services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - wrangler_state:/app/.wrangler
    environment:
      NODE_ENV: development
    command: npm run dev

volumes:
  node_modules:
  wrangler_state:
